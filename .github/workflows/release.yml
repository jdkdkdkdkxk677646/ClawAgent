name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

# The default GITHUB_TOKEN may be read-only (repo setting) — attaching an
# APK to a Release needs contents:write.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install Android SDK
        run: |
          set -ex
          SDK_DIR=$HOME/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools/latest
          cd /tmp
          curl -fL -o ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q ct.zip
          rm ct.zip
          cp -r /tmp/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$SDK_DIR
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK_DIR" > local.properties

      # signingConfig falls back to debug signing when these secrets are not
      # configured, so a release build still succeeds — it just isn't
      # release-signed. Configure KEYSTORE_BASE64 (the .jks file, base64 of
      # the raw bytes), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD to get
      # a properly signed APK.
      - name: Prepare keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 not configured — the APK will be debug-signed. Add the repo secrets to get a release signature."
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.ks.outputs.present }}" = "true" ]; then
            KEYSTORE_FILE=keystore/release.keystore gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/release_build.log
          else
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/release_build.log
          fi

      - name: Upload release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claw-agent-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
