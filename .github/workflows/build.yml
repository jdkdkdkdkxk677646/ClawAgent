name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: '25.1.8937393'
          cmake: '3.22.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.sdk-path }}
          ANDROID_SDK_ROOT: ${{ steps.setup-android.outputs.sdk-path }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: claw-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
