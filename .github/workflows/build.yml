name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -ex
          SDK_DIR=$HOME/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools/latest
          cd /tmp
          curl -fL -o ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q ct.zip
          rm ct.zip
          cp -r /tmp/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$SDK_DIR
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "EXIT=\$?"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: claw-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
