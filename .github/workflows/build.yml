name: Build and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install Android SDK
        run: |
          set -ex
          SDK_DIR=$HOME/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools/latest
          cd /tmp
          curl -fL -o ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q ct.zip
          rm ct.zip
          cp -r /tmp/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$SDK_DIR
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "--- gradle version ---"
          gradle --version
          echo "--- java version ---"
          java -version

      - name: Run Unit Tests
        # 聚合跑:v3.1 之前只有 :app;v4.0 起还有 :core-agent / :core-tools / :data。
        run: gradle :core-agent:test :core-tools:test :data:testDebugUnitTest :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: claw-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
